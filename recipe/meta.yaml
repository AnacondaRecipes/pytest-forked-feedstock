{% set name = "pytest-forked" %}
{% set version = "1.7.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 00f2bee51612f29b8e6b81eed2c3b2975e824c2693394f5bdaf7a1369078ba5f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  skip: true # [py<310]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=41.4
    - setuptools_scm >=3.3
  run:
    - python
    - pytest >=7

test:
  imports:
    - pytest_forked
  files:
    - dummy_test.py
  commands:
    - pytest --forked dummy_test.py  # [not win]

about:
  home: https://github.com/pytest-dev/pytest-forked
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: Run tests in isolated forked subprocesses
  description: Run tests in isolated forked subprocesses.
  dev_url: https://github.com/pytest-dev/pytest-forked
  doc_url: https://github.com/pytest-dev/pytest-forked

extra:
  recipe-maintainers:
    - nicoddemus
